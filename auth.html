
<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kirish va ro‘yxatdan o‘tish — MaceMC</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="montage.css">
</head>
<body class="auth-page">
  <header class="topbar">
    <a class="brand" href="index.html"><span class="logo">M</span> MaceMC</a>
    <a href="index.html" class="btn secondary">← Bosh sahifa</a>
  </header>

  <main class="auth-wrap">
    <section class="auth-card">
      <div class="pill">MaceMC ACCOUNT</div>
      <h1 id="authTitle">Hisobingizga kiring</h1>
      <p class="muted" id="authDescription">Loyihalaringizni davom ettiring.</p>

      <div class="auth-switch">
        <button id="loginTab" class="active" type="button">Kirish</button>
        <button id="registerTab" type="button">Ro‘yxatdan o‘tish</button>
      </div>

      <form id="authForm">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" placeholder="siz@example.com" required>

        <label for="password">Parol</label>
        <input id="password" name="password" type="password" autocomplete="current-password" minlength="8" placeholder="Kamida 8 ta belgi" required>

        <div id="rankWrap" hidden>
          <label for="rank">Tarif tanlang</label>
          <select id="rank" name="rank">
            <option value="Free">Free</option>
            <option value="Plus">Plus</option>
            <option value="Pro">Pro</option>
            <option value="Ultra">Ultra</option>
          </select>
          <p class="muted small-text">Tarifni tanlash to‘lovni amalga oshirmaydi va pullik obunani faollashtirmaydi.</p>
        </div>

        <button id="submitButton" class="btn primary full auth-submit" type="submit">Kirish</button>
        <p id="authMessage" class="form-message" role="status"></p>
      </form>

      <p class="muted small-text">Parolingizni hech kimga bermang. Admin huquqlari faqat serverda tekshiriladi.</p>
    </section>
  </main>

  <script>
  "use strict";

  const form = document.getElementById("authForm");
  const title = document.getElementById("authTitle");
  const description = document.getElementById("authDescription");
  const loginTab = document.getElementById("loginTab");
  const registerTab = document.getElementById("registerTab");
  const rankWrap = document.getElementById("rankWrap");
  const message = document.getElementById("authMessage");
  const submitButton = document.getElementById("submitButton");
  let mode = new URLSearchParams(location.search).get("mode") === "register"
    ? "register" : "login";

  const requestedRank = new URLSearchParams(location.search).get("rank");
  if (["Free", "Plus", "Pro", "Ultra"].includes(requestedRank)) {
    document.getElementById("rank").value = requestedRank;
    mode = "register";
  }

  function setMode(nextMode) {
    mode = nextMode;
    const registering = mode === "register";
    title.textContent = registering ? "Yangi hisob yarating" : "Hisobingizga kiring";
    description.textContent = registering
      ? "MaceMC bilan ijodingizni boshlang."
      : "Loyihalaringizni davom ettiring.";
    submitButton.textContent = registering ? "Hisob yaratish" : "Kirish";
    rankWrap.hidden = !registering;
    loginTab.classList.toggle("active", !registering);
    registerTab.classList.toggle("active", registering);
    document.getElementById("password").autocomplete =
      registering ? "new-password" : "current-password";
    message.textContent = "";
  }

  loginTab.addEventListener("click", () => setMode("login"));
  registerTab.addEventListener("click", () => setMode("register"));

  form.addEventListener("submit", async event => {
    event.preventDefault();
    message.textContent = "";
    submitButton.disabled = true;
    submitButton.textContent = "Kuting...";

    const body = {
      email: document.getElementById("email").value.trim(),
      password: document.getElementById("password").value,
      rank: document.getElementById("rank").value
    };

    try {
      const response = await fetch(
        mode === "register" ? "/api/auth/register" : "/api/auth/login",
        {
          method: "POST",
          credentials: "include",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        }
      );

      const result = await response.json().catch(() => ({}));
      if (!response.ok) {
        throw new Error(result.error || "So‘rov bajarilmadi. Server sozlamalarini tekshiring.");
      }

      message.textContent = "Muvaffaqiyatli! Sahifaga yo‘naltirilmoqda...";
      location.href = "montage.html";
    } catch (error) {
      message.textContent = error.message.includes("Failed to fetch")
        ? "Server ulanmagan. Backend serverni ishga tushiring."
        : error.message;
    } finally {
      submitButton.disabled = false;
      submitButton.textContent = mode === "register" ? "Hisob yaratish" : "Kirish";
    }
  });

  setMode(mode);
  </script>
</body>
</html>
