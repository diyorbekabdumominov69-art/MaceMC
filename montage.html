
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080b14">
<title>MaceMC — AI Video Studio</title>

<style>
:root {
  --bg: #080b14;
  --panel: #111827;
  --border: #283149;
  --text: #f3f5ff;
  --muted: #929bb2;
  --blue: #6c7cff;
  --purple: #a56bff;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  color: var(--text);
  background:
    radial-gradient(ellipse at 50% 0%, #6755ff24, transparent 50%),
    var(--bg);
  font-family: Inter, system-ui, Arial, sans-serif;
}

a { color: inherit; text-decoration: none; }
button, input, select, textarea { font: inherit; }

.topbar {
  min-height: 75px;
  padding: 15px 6%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  flex-wrap: wrap;
  background: #080b14ed;
  border-bottom: 1px solid #ffffff12;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 21px;
  font-weight: 800;
}

.logo {
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  border-radius: 12px;
  background: linear-gradient(135deg, var(--blue), var(--purple));
}

.nav-actions { display: flex; gap: 10px; flex-wrap: wrap; }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 11px 17px;
  color: white;
  background: #ffffff08;
  border: 1px solid var(--border);
  border-radius: 10px;
  cursor: pointer;
  transition: .2s;
}

.btn:hover { transform: translateY(-2px); }

.primary {
  background: linear-gradient(120deg, #5668ff, #9556ef);
  border-color: transparent;
}

.studio {
  max-width: 1200px;
  margin: auto;
  padding: 45px 5% 70px;
}

.eyebrow {
  color: #a99aff;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 2px;
}

h1 {
  font-size: clamp(32px, 5vw, 48px);
  letter-spacing: -1.5px;
  margin: 12px 0;
}

h2 { font-size: 22px; margin-top: 0; }

.muted { color: var(--muted); }

.pill {
  padding: 8px 13px;
  border: 1px solid #7775ff55;
  border-radius: 30px;
  color: #c4bdff;
  font-size: 12px;
  background: #7775ff12;
}

.studio-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
  flex-wrap: wrap;
}

.studio-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.2fr) minmax(260px, .8fr);
  gap: 20px;
  margin-top: 30px;
  align-items: start;
}

.panel {
  min-width: 0;
  padding: 25px;
  background: linear-gradient(145deg, #141c2e, #0b101c);
  border: 1px solid var(--border);
  border-radius: 18px;
  box-shadow: 0 20px 60px #0002;
}

label {
  display: block;
  margin: 17px 0 8px;
  font-size: 14px;
  font-weight: 650;
}

input, select, textarea {
  width: 100%;
  min-width: 0;
  padding: 13px;
  color: white;
  background: #080d18;
  border: 1px solid var(--border);
  border-radius: 10px;
  outline: none;
}

input:focus, select:focus, textarea:focus {
  border-color: var(--blue);
}

input[type="file"] { font-size: 13px; }

textarea {
  min-height: 120px;
  resize: vertical;
}

.submit {
  width: 100%;
  margin-top: 22px;
  padding: 14px;
  font-weight: 750;
}

button:disabled { opacity: .6; cursor: wait; }

.status {
  margin-top: 16px;
  padding: 13px;
  background: #ffffff07;
  border: 1px solid var(--border);
  border-radius: 10px;
  font-size: 13px;
  color: #c8cfff;
  overflow-wrap: anywhere;
}

.job-list { display: grid; gap: 12px; }

.job-item {
  padding: 14px;
  background: #ffffff05;
  border: 1px solid var(--border);
  border-radius: 11px;
  overflow-wrap: anywhere;
}

.job-item a { color: #b5baff; text-decoration: underline; }
.job-item p { color: var(--muted); font-size: 13px; }

footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  padding: 25px 6%;
  color: var(--muted);
  border-top: 1px solid #ffffff12;
}

[hidden] { display: none !important; }

@media (max-width: 720px) {
  .studio { padding: 30px 15px 45px; }
  .studio-grid { grid-template-columns: 1fr; }
  .panel { padding: 19px; }
  footer { flex-direction: column; }
}
</style>
</head>

<body>
<header class="topbar">
  <a class="brand" href="index.html">
    <span class="logo">M</span> MaceMC
  </a>
  <div class="nav-actions">
    <a class="btn" href="index.html">Bosh sahifa</a>
    <button class="btn" id="logoutButton" type="button">Chiqish</button>
  </div>
</header>

<main class="studio">
  <div class="studio-header">
    <div>
      <span class="eyebrow">MACE STUDIO</span>
      <h1>AI Video Montaj</h1>
      <p class="muted">Video loyihalaringizni boshqaring.</p>
    </div>
    <span class="pill">VIDEO WORKSPACE</span>
  </div>

  <div class="studio-grid">
    <section class="panel">
      <h2>✦ Yangi loyiha</h2>
      <form id="renderForm">
        <label for="videoTitle">Loyiha nomi</label>
        <input id="videoTitle" maxlength="100"
          placeholder="Mening birinchi videom" required>

        <label for="videoFile">Video fayl</label>
        <input id="videoFile" type="file" accept="video/*" required>

        <label for="instructions">AI uchun topshiriq</label>
        <textarea id="instructions" maxlength="2000"
          placeholder="Masalan: dinamik montaj, subtitrlar va keraksiz pauzalarni olib tashlash..."></textarea>

        <label for="quality">Video sifati</label>
        <select id="quality">
          <option value="720p">720p HD</option>
          <option value="1080p">1080p Full HD</option>
        </select>

        <button class="btn primary submit" id="renderButton" type="submit">
          ✦ Montajni boshlash
        </button>
      </form>
      <div class="status" id="renderStatus" role="status">
        Loyiha yaratishga tayyor.
      </div>
    </section>

    <section class="panel">
      <h2>▤ Loyihalarim</h2>
      <p class="muted">Render vazifalari va videolar.</p>
      <div class="job-list" id="jobList">
        Backend ulanganida loyihalar shu yerda chiqadi.
      </div>
    </section>
  </div>
</main>

<footer>
  <a class="brand" href="index.html">
    <span class="logo">M</span> MaceMC
  </a>
  <span>© 2026 MaceMC Studio</span>
</footer>

<script src="montage.js"></script>
<script>
document.getElementById("logoutButton").addEventListener("click", async () => {
  try {
    await fetch("/api/auth/logout", {
      method: "POST",
      credentials: "include"
    });
  } catch (error) {
    console.log("Backend server hozircha mavjud emas.");
  }
  location.href = "auth.html";
});
</script>
</body>
</html>
